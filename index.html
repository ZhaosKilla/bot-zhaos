<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Ghostkilla</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0e1621;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-bottom: 15px;
            font-size: 20px;
            text-align: center;
            color: #5288c1;
        }
        .section {
            background: #17212b;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .section h3 {
            font-size: 14px;
            margin: 0 0 8px 0;
            color: #879ea6;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #2b3847;
            border-radius: 8px;
            background: #242f3d;
            color: white;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
        }
        .btn-blue { background-color: #2481cc; }
        .btn-green { background-color: #26a541; }
        .btn-purple { background-color: #8338ec; }
        .btn-red { background-color: #c73e3a; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>⚡ Panel Ghostkilla ⚡</h2>

    <div class="section">
        <h3>🔍 Consultar BIN</h3>
        <input type="text" id="binInput" placeholder="Ej: 526259">
        <button class="btn btn-blue" onclick="ejecutar('/bin ', document.getElementById('binInput').value)">Buscar BIN</button>
    </div>

    <div class="section">
        <h3>⚡ Generador (Gen)</h3>
        <input type="text" id="genInput" placeholder="Ej: 416916xxxx|12|2030|777">
        <button class="btn btn-purple" onclick="ejecutar('/gen ', document.getElementById('genInput').value)">Generar</button>
    </div>

    <div class="section">
        <h3>🌍 Consultar IP</h3>
        <input type="text" id="ipInput" placeholder="Ej: 8.8.8.8">
        <button class="btn btn-green" onclick="ejecutar('/ip ', document.getElementById('ipInput').value)">Buscar IP</button>
    </div>

    <div class="section">
        <button class="btn btn-blue" onclick="enviarDirecto('/faker')">👤 Generar Faker</button>
    </div>

    <button class="btn btn-red" onclick="Telegram.WebApp.close()">❌ Cerrar Menú</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function ejecutar(cmd, val) {
            val = val.trim();
            if (!val) {
                alert("Escribe un valor primero.");
                return;
            }
            mandarAlChat(cmd + val);
        }

        function enviarDirecto(cmd) {
            mandarAlChat(cmd);
        }

        function mandarAlChat(texto) {
            // Abre un enlace interno de Telegram que escribe el comando directamente en la barra de mensajes del chat
            tg.close();
            window.location.href = "https://t.me/share/url?url=" + encodeURIComponent(texto);
        }
    </script>
</body>
</html>
