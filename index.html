<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Bot</title>
    <!-- Librería oficial de Telegram para Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0e1621;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 350px;
        }
        .btn {
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-blue { background-color: #2481cc; }
        .btn-green { background-color: #26a541; }
        .btn-red { background-color: #c73e3a; }
    </style>
</head>
<body>

    <h2>⚡ Panel de Control ⚡</h2>

    <div class="menu-container">
        <button class="btn btn-blue" onclick="alert('Hiciste clic en Gates')">📂 Gates Disponibles</button>
        <button class="btn btn-green" onclick="alert('Sección de comandos')">💻 Comandos del Bot</button>
        <!-- Este botón cierra la ventana automáticamente en Telegram -->
        <button class="btn btn-red" onclick="Telegram.WebApp.close()">❌ Cerrar</button>
    </div>

    <script>
        // Inicializar la Mini App de Telegram
        Telegram.WebApp.ready();
        Telegram.WebApp.expand(); // Extender la ventana al máximo
    </script>
</body>
</html>
